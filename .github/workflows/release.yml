name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # Android: arm64-v8a / armeabi-v7a / Universal APK
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set - Android release builds will fall back to DEBUG signing."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/feathernote-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=feathernote-release.jks
          EOF
          keytool -list -keystore android/app/feathernote-release.jks \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" > /dev/null
          echo "Release keystore ready (alias: ${ANDROID_KEY_ALIAS})."

      # Only the two ARM split APKs and the Universal (all-ABI) APK are built.
      - name: Build APKs (arm64-v8a, armeabi-v7a, Universal)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release

      - name: Verify Android release signatures
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::warning::No release keystore configured, skipping signature verification (DEBUG signed build)."
            exit 0
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER=$(find "${SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner not found under ${SDK_ROOT}/build-tools"
            exit 1
          fi
          fail=0
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-release.apk; do
            echo "== ${apk}"
            "${APKSIGNER}" verify --print-certs "${apk}" | grep -E "certificate DN|SHA-256 digest"
            if ! "${APKSIGNER}" verify --print-certs "${apk}" | grep -q "CN=FeatherNote"; then
              echo "::error::${apk} is not signed with the FeatherNote release key"
              fail=1
            fi
            if "${APKSIGNER}" verify --print-certs "${apk}" | grep -qi "Android Debug"; then
              echo "::error::${apk} is signed with the Android DEBUG key"
              fail=1
            fi
          done
          exit ${fail}

      - name: Organize Android artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "artifacts/FeatherNote-Android-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "artifacts/FeatherNote-Android-armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "artifacts/FeatherNote-Android-Universal.apk"
          ls -lh artifacts

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*

  # ==========================================
  # Publish: Android APK to GitHub Releases
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all release files
        run: ls -la release-artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: 羽记 ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}